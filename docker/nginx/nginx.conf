events { worker_connections 1024; }

http {
    # Use Docker's embedded DNS resolver so upstream hostnames are re-resolved
    # on every request instead of being cached at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;

        location /api/v1/intake {
            set $upstream http://intake-service:8001;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
        location /api/v1/scrape {
            set $upstream http://scraper-service:8002;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
        location /api/v1/intelligence {
            set $upstream http://intelligence-service:8003;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
        location /api/v1/positioning {
            set $upstream http://positioning-service:8004;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
        location /api/v1/icp {
            set $upstream http://icp-service:8005;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
        location /api/v1/targets {
            set $upstream http://icp-service:8005;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
        location /api/v1/embedding {
            set $upstream http://embedding-service:8006;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
        location /api/v1/campaign {
            set $upstream http://campaign-context-service:8007;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
        location /api/v1/workflow {
            set $upstream http://orchestrator:8008;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
        location /api/v1/events {
            set $upstream http://notification-service:8009;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 700s;
            proxy_send_timeout 700s;
        }

        location / {
            set $upstream http://frontend:3000;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
