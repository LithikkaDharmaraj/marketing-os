---
# Shared env ref for all backend services
# Each service below follows the same Deployment + Service pattern.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-service
  namespace: marketing-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intake-service
  template:
    metadata:
      labels:
        app: intake-service
    spec:
      containers:
        - name: intake-service
          image: marketing-os/intake-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: marketing-os-config
            - secretRef:
                name: marketing-os-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: intake-service
  namespace: marketing-os
spec:
  selector:
    app: intake-service
  ports:
    - port: 8001
      targetPort: 8001
---
