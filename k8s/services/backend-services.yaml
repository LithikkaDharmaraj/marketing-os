---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: marketing-os
spec:
  replicas: 3
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: marketing-os/celery-worker:latest
          command:
            - celery
            - -A
            - shared.celery_app
            - worker
            - --loglevel=info
            - -Q
            - scraper:jobs,intelligence:extract,positioning:generate,icp:generate,embedding:upsert,default
          envFrom:
            - configMapRef:
                name: marketing-os-config
            - secretRef:
                name: marketing-os-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: marketing-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: marketing-os/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: /api
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: marketing-os
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
