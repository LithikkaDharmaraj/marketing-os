apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketing-os-ingress
  namespace: marketing-os
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Disable buffering for SSE endpoints
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: marketing-os.local
      http:
        paths:
          - path: /api/v1/intake
            pathType: Prefix
            backend:
              service:
                name: intake-service
                port:
                  number: 8001
          - path: /api/v1/scrape
            pathType: Prefix
            backend:
              service:
                name: scraper-service
                port:
                  number: 8002
          - path: /api/v1/intelligence
            pathType: Prefix
            backend:
              service:
                name: intelligence-service
                port:
                  number: 8003
          - path: /api/v1/positioning
            pathType: Prefix
            backend:
              service:
                name: positioning-service
                port:
                  number: 8004
          - path: /api/v1/icp
            pathType: Prefix
            backend:
              service:
                name: icp-service
                port:
                  number: 8005
          - path: /api/v1/embedding
            pathType: Prefix
            backend:
              service:
                name: embedding-service
                port:
                  number: 8006
          - path: /api/v1/campaign
            pathType: Prefix
            backend:
              service:
                name: campaign-context-service
                port:
                  number: 8007
          - path: /api/v1/workflow
            pathType: Prefix
            backend:
              service:
                name: orchestrator-service
                port:
                  number: 8008
          - path: /api/v1/events
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8009
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
